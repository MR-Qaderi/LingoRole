<!doctype html>
<html lang="fa" dir="rtl" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="LingoTalk — text-based language practice, roleplay and personal learning feedback. گپ‌یار: تمرین مکالمه و نقش‌آفرینی با گزارش آموزشی."
    />
    <title>LingoTalk | گپ‌یار</title>
    <link id="favicon" rel="icon" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      /* LingoTalk 1.0 — self-contained styles; external font is optional. */
      :root {
        color-scheme: light;
        --bg: #f3f5f9;
        --surface: #fff;
        --surface2: #f8fafc;
        --surface3: #edf2f8;
        --text: #101827;
        --muted: #617087;
        --muted2: #8391a5;
        --border: #dfe5ee;
        --borderstrong: #c6d0df;
        --accent: #2563eb;
        --purple: #7c3aed;
        --cyan: #06b6d4;
        --success: #07845d;
        --danger: #c62f43;
        --warning: #ae6a09;
        --ring: #2563eb33;
        --shadow: 0 22px 66px -42px #182b5070;
        --user: #244dde;
        --user2: #6644dc;
        --glow: #e9edff;
        --header: #f3f5f9dd;
      }
      [data-theme="dark"] {
        color-scheme: dark;
        --bg: #060a17;
        --surface: #0d1424;
        --surface2: #121c2e;
        --surface3: #19253a;
        --text: #edf2ff;
        --muted: #a4b1c8;
        --muted2: #7889a5;
        --border: #233047;
        --borderstrong: #364560;
        --accent: #86b3ff;
        --purple: #c19aff;
        --cyan: #58cfed;
        --success: #5fdbac;
        --danger: #ff9aa9;
        --warning: #ffd27e;
        --ring: #7ea8fb35;
        --shadow: 0 24px 70px -32px #000b;
        --user: #324fce;
        --user2: #6240bb;
        --glow: #222047;
        --header: #0b1121db;
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        font:
          14px/1.8 Vazirmatn,
          Tahoma,
          Arial,
          sans-serif;
        color: var(--text);
        background: var(--bg);
        background-image:
          radial-gradient(800px 500px at 2% -8%, #477ee820, transparent 70%),
          radial-gradient(800px 450px at 98% 0%, #9d63de1b, transparent 70%);
        min-height: 100svh;
        -webkit-font-smoothing: antialiased;
      }
      body:before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -1;
        pointer-events: none;
        background-image:
          linear-gradient(#8198ba08 1px, transparent 1px),
          linear-gradient(90deg, #8198ba08 1px, transparent 1px);
        background-size: 42px 42px;
        mask-image: linear-gradient(#000, transparent 80%);
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button,
      a,
      input,
      select,
      textarea {
        -webkit-tap-highlight-color: transparent;
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible,
      summary:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 3px;
      }
      a {
        color: var(--accent);
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      svg {
        display: block;
        flex-shrink: 0;
      }
      button svg,
      a svg {
        width: 18px;
        height: 18px;
      }
      button {
        color: inherit;
      }
      ::selection {
        background: var(--ring);
      }
      [hidden] {
        display: none !important;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      .muted {
        color: var(--muted);
      }
      .small {
        font-size: 12px;
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      }
      .ellipsis {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .wrap {
        overflow-wrap: anywhere;
      }
      .site-header {
        border-bottom: 1px solid var(--border);
        background: var(--header);
        backdrop-filter: blur(22px);
        position: relative;
        z-index: 10;
      }
      .header-inner {
        max-width: 1320px;
        margin: auto;
        padding: 18px 28px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 13px;
        min-width: 0;
      }
      .brand-mark {
        background: #fff;
        color: #000;
        border: 1px solid #bec9dd4d;
        border-radius: 17px;
        padding: 8px;
        flex: 0 0 auto;
        width: 52px;
        height: 52px;
        box-shadow: 0 7px 24px #0002;
      }
      .brand-mark svg {
        width: 100%;
        height: 100%;
      }
      .brand-name {
        font-size: 22px;
        font-weight: 800;
        line-height: 1.45;
        letter-spacing: -0.6px;
      }
      .brand-name bdi {
        font-size: 16px;
        font-weight: 600;
        color: var(--muted);
        margin-inline-start: 8px;
      }
      .brand-kicker {
        font-size: 10px;
        color: var(--accent);
        letter-spacing: 2px;
        direction: ltr;
        text-align: start;
      }
      .header-controls {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .language-select {
        min-width: 144px;
        padding: 9px 12px;
        border-radius: 13px;
        border: 1px solid var(--border);
        color: var(--text);
        background: var(--surface);
        font-size: 12px;
      }
      .icon-btn {
        height: 42px;
        width: 42px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--border);
        border-radius: 13px;
        background: var(--surface);
        color: var(--text);
      }
      .icon-btn:hover {
        border-color: var(--borderstrong);
        background: var(--surface3);
      }
      .workspace {
        max-width: 1320px;
        margin: 28px auto 0;
        padding: 0 28px;
        display: grid;
        grid-template-columns: 310px minmax(0, 1fr);
        gap: 20px;
        align-items: start;
      }
      .panel {
        background: var(--surface);
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
        border-radius: 26px;
        overflow: hidden;
      }
      .scene-panel {
        position: sticky;
        top: 20px;
      }
      .panel-head {
        padding: 22px 22px 0;
      }
      .eyebrow {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 1.1px;
        text-transform: uppercase;
        color: var(--accent);
      }
      .eyebrow span:first-child {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 0 4px var(--ring);
      }
      .panel-head h2 {
        font-size: 20px;
        margin-top: 6px;
        letter-spacing: -0.5px;
      }
      .panel-head p {
        margin: 5px 0 14px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.9;
      }
      .scene-form {
        padding: 0 22px 22px;
      }
      .field {
        margin-top: 16px;
        min-width: 0;
      }
      .field label,
      .field-label {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 6px;
        font-size: 12px;
        font-weight: 700;
      }
      .optional {
        font-weight: 400;
        color: var(--muted2);
        font-size: 10px;
        margin-inline-start: auto;
      }
      .field select,
      .field textarea,
      .field input {
        display: block;
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 13px;
        padding: 10px 11px;
        color: var(--text);
        background: var(--surface2);
        line-height: 1.65;
        min-width: 0;
      }
      .field textarea {
        min-height: 94px;
        resize: vertical;
        font-size: 13px;
      }
      .field input {
        font-size: 13px;
      }
      .field select:focus,
      .field textarea:focus,
      .field input:focus {
        outline: 0;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--ring);
      }
      .form-row {
        display: grid;
        grid-template-columns: 1.15fr 1fr;
        gap: 9px;
      }
      .field-helper {
        display: block;
        font-size: 10px;
        color: var(--muted2);
        margin-top: 5px;
      }
      .more-settings {
        margin-top: 18px;
        border-top: 1px solid var(--border);
      }
      .more-settings summary {
        list-style: none;
        padding: 13px 0 2px;
        cursor: pointer;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 12px;
        font-weight: 700;
        color: var(--muted);
      }
      .more-settings summary::-webkit-details-marker {
        display: none;
      }
      .chevron {
        font-size: 18px;
        transition: transform 0.2s;
      }
      .more-settings[open] .chevron {
        transform: rotate(180deg);
      }
      .scene-form fieldset {
        border: 0;
        margin: 0;
        padding: 0;
        min-width: 0;
      }
      .scene-form fieldset:disabled {
        opacity: 0.6;
      }
      .scene-form fieldset:disabled summary {
        pointer-events: none;
      }
      .scene-form fieldset:disabled input,
      .scene-form fieldset:disabled select,
      .scene-form fieldset:disabled textarea {
        cursor: default;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 10px 16px;
        min-height: 42px;
        border: 1px solid var(--border);
        border-radius: 13px;
        font-weight: 700;
        font-size: 12px;
        line-height: 1.5;
        background: var(--surface2);
        transition:
          background 0.15s,
          border-color 0.15s,
          transform 0.15s;
        text-decoration: none;
      }
      .btn:hover:not(:disabled) {
        border-color: var(--borderstrong);
        background: var(--surface3);
        text-decoration: none;
        transform: translateY(-1px);
      }
      .btn-primary {
        color: #fff;
        background: linear-gradient(135deg, var(--user), var(--user2));
        border-color: transparent;
        box-shadow: 0 10px 22px -10px #5553d980;
      }
      .btn-primary:hover:not(:disabled) {
        background: linear-gradient(135deg, #3b5cde, #7951d2);
        border-color: transparent;
      }
      .btn-quiet {
        color: var(--muted);
        background: transparent;
      }
      .btn-danger {
        color: var(--danger);
        background: transparent;
      }
      .wide {
        width: 100%;
      }
      .scene-form .start-btn {
        margin-top: 22px;
        min-height: 47px;
        font-size: 13px;
      }
      .mini-note {
        margin-top: 10px;
        text-align: center;
        font-size: 10px;
        color: var(--muted2);
      }
      .locked-note {
        margin-top: 16px;
        padding: 10px;
        border-radius: 12px;
        background: var(--surface2);
        font-size: 11px;
        color: var(--muted);
      }
      .session-actions {
        display: grid;
        gap: 9px;
        margin-top: 17px;
      }
      .ecosystem-small {
        padding: 16px 22px;
        border-top: 1px solid var(--border);
        font-size: 11px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        color: var(--muted);
      }
      .ecosystem-small a {
        color: var(--text);
        display: flex;
        align-items: center;
        gap: 5px;
        font-weight: 700;
      }
      .chat-panel {
        min-width: 0;
        position: relative;
      }
      .chat-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding: 18px 24px;
        border-bottom: 1px solid var(--border);
        background: linear-gradient(110deg, var(--surface), var(--surface2));
      }
      .partner {
        display: flex;
        align-items: center;
        gap: 11px;
        min-width: 0;
      }
      .partner-avatar {
        width: 42px;
        height: 42px;
        background: var(--surface3);
        color: var(--accent);
        border: 1px solid var(--border);
        border-radius: 14px;
        display: grid;
        place-items: center;
        flex-shrink: 0;
      }
      .partner-avatar svg {
        width: 25px;
        height: 25px;
      }
      .partner-title {
        font-size: 14px;
        font-weight: 800;
        max-width: 400px;
      }
      .partner-meta {
        display: flex;
        gap: 6px;
        align-items: center;
        color: var(--muted);
        font-size: 10px;
      }
      .live-dot {
        background: var(--success);
        width: 5px;
        height: 5px;
        border-radius: 50%;
        margin-inline-end: 2px;
      }
      .head-actions {
        display: flex;
        gap: 7px;
        align-items: center;
      }
      .mobile-settings {
        display: none;
      }
      .chat-tags {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 9px 24px;
        min-height: 42px;
        background: var(--surface2);
        border-bottom: 1px solid var(--border);
        font-size: 10px;
        color: var(--muted);
        flex-wrap: wrap;
      }
      .chat-tag {
        display: inline-flex;
        gap: 5px;
        align-items: center;
        padding: 3px 8px;
        border-radius: 6px;
        background: var(--surface3);
        color: var(--muted);
      }
      .chat-tag svg {
        width: 12px;
        height: 12px;
      }
      .session-stats {
        margin-inline-start: auto;
        color: var(--muted2);
        white-space: nowrap;
      }
      .welcome {
        padding: 40px 35px 30px;
        min-height: 550px;
        position: relative;
        overflow: hidden;
        background: radial-gradient(
          480px 300px at 50% 0%,
          var(--glow),
          transparent 95%
        );
      }
      .welcome-emblem {
        position: relative;
        width: 80px;
        height: 80px;
        margin: 0 auto 16px;
        background: var(--surface2);
        border: 1px solid var(--borderstrong);
        border-radius: 26px;
        display: grid;
        place-items: center;
        box-shadow: 0 12px 40px #4457bd16;
        transform: rotate(-5deg);
      }
      .welcome-emblem svg {
        width: 42px;
        height: 42px;
        color: var(--text);
        transform: rotate(5deg);
      }
      .welcome-emblem:after {
        content: "";
        position: absolute;
        width: 10px;
        height: 10px;
        border-radius: 3px;
        background: var(--purple);
        inset-inline-end: -5px;
        top: 8px;
        transform: rotate(20deg);
      }
      .welcome-copy {
        text-align: center;
        max-width: 520px;
        margin: auto;
      }
      .welcome h1 {
        font-size: clamp(26px, 3vw, 36px);
        letter-spacing: -1px;
        line-height: 1.45;
        font-weight: 800;
      }
      .welcome p {
        font-size: 13px;
        line-height: 2;
        color: var(--muted);
        margin: 12px auto 0;
        max-width: 470px;
      }
      .welcome-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 10px;
        letter-spacing: 0.8px;
        color: var(--accent);
        margin-bottom: 9px;
      }
      .scenario-label {
        margin: 27px 0 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 11px;
        font-weight: 700;
        color: var(--muted);
      }
      .scenario-label span:last-child {
        font-weight: 400;
        color: var(--muted2);
      }
      .scenario-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 9px;
      }
      .scenario-card {
        padding: 13px 12px;
        display: flex;
        align-items: flex-start;
        gap: 9px;
        text-align: start;
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: 15px;
        position: relative;
        min-width: 0;
        transition:
          transform 0.2s,
          border-color 0.2s,
          background 0.2s;
      }
      .scenario-card:hover {
        border-color: var(--accent);
        transform: translateY(-2px);
        background: var(--surface3);
      }
      .scenario-card[aria-pressed="true"] {
        border-color: var(--accent);
        background: var(--glow);
        box-shadow: inset 0 0 0 1px var(--accent);
      }
      .scenario-icon {
        color: var(--accent);
        padding-top: 4px;
      }
      .scenario-icon svg {
        width: 22px;
        height: 22px;
      }
      .scenario-card strong {
        display: block;
        font-size: 11px;
        font-weight: 700;
        line-height: 1.8;
      }
      .scenario-card small {
        display: block;
        color: var(--muted2);
        font-size: 9px;
        line-height: 1.7;
        margin-top: 2px;
      }
      .welcome-start {
        display: flex;
        justify-content: center;
        margin-top: 23px;
      }
      .welcome-start .btn {
        min-width: 210px;
        padding: 12px 21px;
      }
      .welcome-foot {
        display: flex;
        align-items: center;
        gap: 7px;
        justify-content: center;
        flex-wrap: wrap;
        margin-top: 12px;
        font-size: 10px;
        color: var(--muted2);
      }
      .welcome-foot span + span:before {
        content: "·";
        margin-inline-end: 7px;
      }
      .messages {
        direction: ltr;
        height: min(61svh, 620px);
        min-height: 350px;
        padding: 26px 25px 18px;
        overflow-y: auto;
        overscroll-behavior: contain;
        scrollbar-width: thin;
        scrollbar-color: var(--borderstrong) transparent;
        background: radial-gradient(
          500px 500px at 100% 100%,
          #7886d207,
          transparent
        );
      }
      .message {
        display: flex;
        align-items: flex-end;
        gap: 9px;
        margin-bottom: 23px;
      }
      .message.user {
        flex-direction: row-reverse;
      }
      .message-avatar {
        height: 29px;
        width: 29px;
        display: grid;
        place-items: center;
        border-radius: 10px;
        background: var(--surface3);
        color: var(--muted);
        border: 1px solid var(--border);
        flex-shrink: 0;
      }
      .message-avatar svg {
        width: 17px;
        height: 17px;
      }
      .message.user .message-avatar {
        color: var(--accent);
      }
      .message-body {
        max-width: 78%;
        min-width: 60px;
        position: relative;
      }
      .message-line {
        font-size: 9px;
        display: flex;
        gap: 7px;
        align-items: center;
        color: var(--muted2);
        padding: 0 3px 4px;
      }
      .message.user .message-line {
        justify-content: flex-end;
      }
      .bubble {
        padding: 13px 17px;
        border: 1px solid var(--border);
        border-radius: 18px 18px 18px 5px;
        background: var(--surface2);
        font-size: 14px;
        line-height: 1.9;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        unicode-bidi: plaintext;
      }
      .message.user .bubble {
        color: #fff;
        background: linear-gradient(135deg, var(--user), var(--user2));
        border-color: transparent;
        border-radius: 18px 18px 5px 18px;
      }
      .message[data-status="failed"] .bubble {
        border: 1px solid var(--danger);
        opacity: 0.85;
      }
      .message-copy {
        width: 24px;
        height: 24px;
        border-radius: 6px;
        border: 0;
        background: transparent;
        display: grid;
        place-items: center;
        color: var(--muted2);
        opacity: 0;
        transition: opacity 0.15s;
      }
      .message-copy svg {
        width: 12px;
        height: 12px;
      }
      .message:hover .message-copy,
      .message:focus-within .message-copy {
        opacity: 1;
      }
      .pending-label {
        color: var(--danger);
        font-size: 10px;
        padding: 3px 2px;
      }
      .typing {
        display: inline-flex;
        gap: 5px;
        align-items: center;
        min-height: 26px;
      }
      .typing i {
        width: 6px;
        height: 6px;
        background: var(--muted2);
        border-radius: 50%;
        animation: typing 1.3s infinite;
      }
      .typing i:nth-child(2) {
        animation-delay: 0.2s;
      }
      .typing i:nth-child(3) {
        animation-delay: 0.4s;
      }
      @keyframes typing {
        0%,
        65%,
        100% {
          transform: translateY(0);
          opacity: 0.4;
        }
        35% {
          transform: translateY(-4px);
          opacity: 1;
        }
      }
      .composer {
        border-top: 1px solid var(--border);
        padding: 15px 23px 13px;
        background: var(--surface);
      }
      .compose-row {
        border: 1px solid var(--borderstrong);
        border-radius: 17px;
        display: flex;
        align-items: flex-end;
        padding: 8px;
        background: var(--surface2);
        gap: 7px;
      }
      .compose-row:focus-within {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--ring);
      }
      .compose-row textarea {
        width: 100%;
        padding: 7px 9px;
        resize: none;
        min-height: 42px;
        max-height: 155px;
        line-height: 1.8;
        outline: none;
        background: transparent;
        color: var(--text);
        border: 0;
        font-size: 15px;
        overflow-y: auto;
      }
      .compose-row textarea:focus-visible {
        outline: none;
      }
      .send-btn {
        width: 42px;
        height: 42px;
        padding: 0;
        border-radius: 12px;
        flex-shrink: 0;
      }
      .send-btn svg {
        width: 20px;
        height: 20px;
      }
      .composer-foot {
        display: flex;
        align-items: center;
        gap: 8px;
        justify-content: space-between;
        font-size: 9px;
        color: var(--muted2);
        margin-top: 8px;
      }
      .stop-btn {
        border: 0;
        background: transparent;
        color: var(--accent);
        padding: 0;
        font-size: 10px;
        font-weight: 700;
      }
      .ended-note {
        padding: 15px 24px;
        border-top: 1px solid var(--border);
        background: var(--surface2);
        font-size: 12px;
        color: var(--muted);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }
      .empty-session {
        min-height: 360px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        color: var(--muted);
        padding: 35px;
      }
      .tabs {
        display: flex;
        border-bottom: 1px solid var(--border);
        background: var(--surface2);
        padding: 0 22px;
        gap: 22px;
      }
      .tab {
        padding: 14px 0;
        border: 0;
        border-bottom: 2px solid transparent;
        background: transparent;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
      }
      .tab[aria-selected="true"] {
        color: var(--accent);
        border-bottom-color: var(--accent);
      }
      .error-box {
        margin: 14px 23px 0;
        padding: 12px 14px;
        border: 1px solid color-mix(in srgb, var(--danger) 45%, var(--border));
        border-radius: 14px;
        background: color-mix(in srgb, var(--danger) 6%, var(--surface));
        font-size: 12px;
      }
      .error-title {
        font-weight: 700;
        color: var(--danger);
      }
      .error-detail {
        color: var(--muted);
        font-size: 10px;
        margin-top: 4px;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
      }
      .error-actions {
        display: flex;
        gap: 7px;
        align-items: center;
        margin-top: 10px;
        flex-wrap: wrap;
      }
      .error-actions .btn {
        min-height: 33px;
        padding: 7px 10px;
        font-size: 10px;
      }
      .cooldown {
        color: var(--muted);
        font-size: 10px;
      }
      .report-panel {
        padding: 25px;
        min-height: 550px;
      }
      .report-loader {
        text-align: center;
        padding: 68px 24px;
      }
      .spinner {
        width: 37px;
        height: 37px;
        border: 2px solid var(--borderstrong);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
        margin: 0 auto 19px;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .report-loader h2 {
        font-size: 22px;
        line-height: 1.6;
      }
      .report-loader p {
        font-size: 12px;
        color: var(--muted);
        margin-top: 10px;
        max-width: 400px;
        margin-inline: auto;
      }
      .report-progress {
        color: var(--accent);
        font-size: 11px;
        margin-top: 18px;
      }
      .report-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 15px;
        margin-bottom: 20px;
        flex-wrap: wrap;
      }
      .report-top h2 {
        font-size: 23px;
        letter-spacing: -0.6px;
      }
      .report-top p {
        font-size: 10px;
        color: var(--muted);
        margin-top: 3px;
      }
      .report-toolbar {
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
      }
      .report-toolbar .btn {
        font-size: 10px;
        min-height: 36px;
        padding: 8px 12px;
      }
      .report-overview {
        padding: 21px;
        border: 1px solid var(--border);
        border-radius: 21px;
        background: linear-gradient(135deg, var(--glow), var(--surface2));
        margin-bottom: 15px;
      }
      .report-stats {
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
        margin-bottom: 13px;
      }
      .report-stat {
        padding: 5px 10px;
        font-size: 10px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--muted);
      }
      .report-stat.level {
        color: var(--accent);
        font-weight: 800;
      }
      .report-overview p {
        line-height: 2;
        font-size: 13px;
      }
      .level-note {
        color: var(--muted);
        font-size: 10px;
        margin-top: 9px;
        display: block;
      }
      .report-section {
        margin-top: 15px;
      }
      .section-title {
        font-size: 13px;
        font-weight: 800;
        margin-bottom: 10px;
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .section-title svg {
        color: var(--accent);
        width: 17px;
        height: 17px;
      }
      .strength-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 9px;
      }
      .strength-card {
        border: 1px solid var(--border);
        border-radius: 15px;
        padding: 14px;
        background: var(--surface2);
      }
      .strength-card:only-child {
        grid-column: 1/-1;
      }
      .strength-card h3 {
        font-size: 12px;
        color: var(--success);
      }
      .strength-card p {
        font-size: 11px;
        color: var(--muted);
        margin-top: 6px;
      }
      .evidence {
        display: block;
        font-size: 12px;
        color: var(--text);
        padding: 8px 10px;
        border-radius: 8px;
        background: var(--surface);
        margin-top: 8px;
        white-space: pre-wrap;
        unicode-bidi: plaintext;
        overflow-wrap: anywhere;
      }
      .area-card {
        border: 1px solid var(--border);
        border-radius: 18px;
        margin-top: 12px;
        background: var(--surface2);
        overflow: hidden;
      }
      .area-card summary {
        list-style: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 15px 17px;
        font-size: 13px;
        font-weight: 800;
      }
      .area-card summary::-webkit-details-marker {
        display: none;
      }
      .area-card summary svg {
        width: 18px;
        height: 18px;
        color: var(--accent);
      }
      .area-card .count-chip {
        padding: 1px 7px;
        background: var(--surface3);
        font-size: 10px;
        font-weight: 500;
        border-radius: 5px;
        margin-inline-start: auto;
      }
      .area-card .chevron {
        font-size: 15px;
        color: var(--muted2);
      }
      .area-card[open] .chevron {
        transform: rotate(180deg);
      }
      .area-body {
        padding: 0 17px 17px;
      }
      .assessment {
        font-size: 11px;
        color: var(--muted);
        line-height: 1.9;
        margin-bottom: 9px;
      }
      .feedback-item {
        padding: 13px;
        border: 1px solid var(--border);
        border-radius: 13px;
        background: var(--surface);
        margin-top: 9px;
      }
      .feedback-type {
        font-size: 9px;
        font-weight: 700;
        color: var(--muted2);
        margin-bottom: 8px;
        display: flex;
        justify-content: space-between;
        gap: 5px;
      }
      .quote-label {
        font-size: 9px;
        color: var(--muted2);
        margin-bottom: 3px;
      }
      .feedback-quote {
        font-size: 12px;
        white-space: pre-wrap;
        unicode-bidi: plaintext;
        overflow-wrap: anywhere;
      }
      .feedback-quote.original {
        color: var(--muted);
        text-decoration-color: var(--borderstrong);
      }
      .feedback-quote.improved {
        color: var(--success);
        margin-top: 7px;
        padding-top: 7px;
        border-top: 1px dashed var(--border);
      }
      .feedback-explanation {
        font-size: 11px;
        line-height: 1.95;
        color: var(--muted);
        margin-top: 9px;
      }
      .vocab-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-top: 22px;
      }
      .vocab-list {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 9px;
        margin-top: 10px;
      }
      .vocab-item {
        border: 1px solid var(--border);
        border-radius: 15px;
        padding: 14px;
        background: var(--surface2);
      }
      .vocab-term {
        font-size: 14px;
        font-weight: 800;
        unicode-bidi: plaintext;
      }
      .vocab-source {
        font-size: 8px;
        color: var(--accent);
        font-weight: 500;
        display: inline-block;
        padding: 2px 6px;
        border-radius: 5px;
        background: var(--surface3);
        margin-top: 4px;
      }
      .vocab-meaning {
        font-size: 11px;
        color: var(--muted);
        margin-top: 7px;
      }
      .vocab-example {
        font-size: 11px;
        margin-top: 9px;
        border-top: 1px solid var(--border);
        padding-top: 8px;
        unicode-bidi: plaintext;
      }
      .ecosystem-card {
        padding: 15px 18px;
        background: var(--surface2);
        border: 1px solid var(--borderstrong);
        border-radius: 17px;
        margin-top: 15px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        text-decoration: none;
        color: var(--text);
      }
      .ecosystem-card strong {
        font-size: 12px;
      }
      .ecosystem-card p {
        color: var(--muted);
        font-size: 10px;
        margin-top: 3px;
      }
      .ecosystem-card:hover {
        border-color: var(--accent);
        text-decoration: none;
      }
      .priority-list {
        padding: 16px 18px;
        border: 1px solid var(--border);
        border-radius: 17px;
        background: var(--glow);
        margin-top: 16px;
      }
      .priority-list h3 {
        font-size: 12px;
        margin-bottom: 8px;
      }
      .priority-list p {
        font-size: 11px;
        line-height: 1.9;
      }
      .priority-list li {
        font-size: 11px;
        line-height: 1.9;
        margin: 7px 0;
      }
      .priority-list ul {
        padding-inline-start: 20px;
        margin: 0;
      }
      .export-option {
        display: flex;
        gap: 7px;
        align-items: center;
        font-size: 10px;
        color: var(--muted);
        margin-top: 15px;
      }
      .export-option input {
        accent-color: var(--accent);
      }
      .report-language-note {
        color: var(--muted2);
        font-size: 9px;
        margin-top: 15px;
      }
      .no-report {
        padding: 35px;
        text-align: center;
        color: var(--muted);
      }
      .creator-footer {
        max-width: 1320px;
        margin: 22px auto 0;
        padding: 0 28px 28px;
      }
      .creator-card {
        border: 1px solid var(--border);
        background: var(--surface);
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        padding: 15px 21px;
      }
      .creator-id {
        display: flex;
        align-items: center;
        gap: 13px;
      }
      .creator-avatar {
        width: 45px;
        height: 45px;
        border-radius: 50%;
        object-fit: cover;
        background: var(--surface3);
        border: 1px solid var(--border);
      }
      .creator-kicker {
        font-size: 8px;
        letter-spacing: 1px;
        text-transform: uppercase;
        color: var(--muted2);
      }
      .creator-name {
        font-size: 12px;
        font-weight: 700;
        color: var(--text);
      }
      .creator-role {
        font-size: 9px;
        color: var(--muted);
      }
      .creator-links {
        display: flex;
        gap: 7px;
      }
      .creator-links a {
        font-size: 10px;
        color: var(--muted);
        border: 1px solid var(--border);
        border-radius: 9px;
        padding: 6px 10px;
      }
      .privacy {
        margin: 12px 0 0;
        color: var(--muted2);
        font-size: 9px;
        text-align: center;
        line-height: 1.9;
      }
      .version-tag {
        margin-inline-start: 6px;
        direction: ltr;
        display: inline-block;
      }
      .toast {
        position: fixed;
        bottom: 25px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--surface3);
        border: 1px solid var(--borderstrong);
        border-radius: 12px;
        padding: 10px 18px;
        font-size: 12px;
        box-shadow: var(--shadow);
        z-index: 40;
        max-width: 90vw;
        text-align: center;
      }
      .dialog {
        background: var(--surface);
        color: var(--text);
        border: 1px solid var(--borderstrong);
        border-radius: 23px;
        padding: 24px;
        max-width: min(420px, 90vw);
        box-shadow: 0 25px 70px #0005;
      }
      .dialog::backdrop {
        background: #030817b0;
        backdrop-filter: blur(5px);
      }
      .dialog h2 {
        font-size: 18px;
        margin-bottom: 10px;
      }
      .dialog p {
        font-size: 12px;
        color: var(--muted);
        line-height: 1.9;
      }
      .dialog-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 22px;
      }
      .scroll-down {
        position: absolute;
        bottom: 115px;
        inset-inline-end: 22px;
        background: var(--surface);
        border: 1px solid var(--borderstrong);
        border-radius: 50%;
        width: 33px;
        height: 33px;
        display: grid;
        place-items: center;
        box-shadow: var(--shadow);
        z-index: 3;
      }
      @media (min-width: 1300px) {
        .workspace {
          grid-template-columns: 330px minmax(0, 1fr);
        }
      }
      @media (max-width: 1050px) {
        .workspace {
          grid-template-columns: 280px minmax(0, 1fr);
          padding: 0 20px;
          gap: 15px;
        }
        .header-inner {
          padding-inline: 20px;
        }
        .scene-form {
          padding-inline: 18px;
        }
        .panel-head {
          padding-inline: 18px;
        }
        .welcome {
          padding: 30px 23px;
        }
        .scenario-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .scenario-card small {
          font-size: 10px;
        }
        .partner-title {
          max-width: 270px;
        }
        .creator-footer {
          padding-inline: 20px;
        }
        .scene-panel {
          top: 15px;
        }
      }
      @media (max-width: 760px) {
        .header-inner {
          padding: 13px 16px;
          gap: 12px;
        }
        .brand-mark {
          width: 43px;
          height: 43px;
          border-radius: 13px;
          padding: 7px;
        }
        .brand-name {
          font-size: 18px;
        }
        .brand-name bdi {
          display: none;
        }
        .brand-kicker {
          font-size: 8px;
          letter-spacing: 1px;
        }
        .language-select {
          min-width: 0;
          width: 115px;
          font-size: 11px;
          padding: 9px;
        }
        .icon-btn {
          height: 37px;
          width: 37px;
          border-radius: 11px;
        }
        .header-controls {
          gap: 5px;
        }
        .workspace {
          display: flex;
          flex-direction: column;
          margin-top: 16px;
          padding: 0 14px;
          gap: 13px;
        }
        .scene-panel {
          position: relative;
          top: auto;
          order: 2;
          width: 100%;
        }
        .chat-panel {
          order: 1;
          width: 100%;
        }
        .scene-panel:not(.mobile-open) {
          display: none;
        }
        .mobile-settings {
          display: inline-flex;
        }
        .panel {
          border-radius: 22px;
        }
        .chat-head {
          padding: 14px 16px;
        }
        .partner-title {
          max-width: 40vw;
          font-size: 12px;
        }
        .partner-avatar {
          width: 35px;
          height: 35px;
          border-radius: 12px;
        }
        .partner-avatar svg {
          width: 21px;
          height: 21px;
        }
        .partner-meta {
          font-size: 9px;
        }
        .head-actions {
          gap: 5px;
        }
        .head-actions .btn {
          font-size: 10px;
          min-height: 35px;
          padding: 8px 10px;
        }
        .chat-tags {
          padding: 8px 16px;
          font-size: 9px;
        }
        .welcome {
          padding: 30px 22px 25px;
          min-height: 540px;
        }
        .welcome h1 {
          font-size: 28px;
        }
        .welcome p {
          font-size: 12px;
        }
        .welcome-emblem {
          width: 67px;
          height: 67px;
          border-radius: 23px;
        }
        .welcome-emblem svg {
          width: 35px;
          height: 35px;
        }
        .scenario-card {
          padding: 12px 10px;
        }
        .scenario-card strong {
          font-size: 11px;
        }
        .scenario-card small {
          font-size: 9px;
        }
        .scenario-grid {
          gap: 8px;
        }
        .messages {
          direction: ltr;
          height: 56svh;
          min-height: 300px;
          padding: 20px 14px;
        }
        .message-body {
          max-width: 85%;
        }
        .message-avatar {
          height: 24px;
          width: 24px;
          border-radius: 8px;
        }
        .message {
          gap: 6px;
        }
        .bubble {
          font-size: 14px;
          padding: 11px 14px;
        }
        .message-copy {
          opacity: 1;
        }
        .composer {
          padding: 12px 14px;
        }
        .compose-row textarea {
          font-size: 16px;
        }
        .composer-foot .keyboard-hint {
          display: none;
        }
        .creator-footer {
          padding: 0 14px 24px;
          margin-top: 16px;
        }
        .creator-card {
          padding: 13px 16px;
          border-radius: 18px;
        }
        .creator-links {
          flex-direction: column;
          gap: 4px;
        }
        .creator-links a {
          padding: 3px 9px;
          font-size: 9px;
        }
        .report-panel {
          padding: 20px 16px;
        }
        .report-top {
          gap: 10px;
        }
        .report-toolbar .btn {
          font-size: 10px;
        }
        .report-overview {
          padding: 17px;
        }
        .strength-grid,
        .vocab-list {
          grid-template-columns: 1fr;
        }
        .tabs {
          padding-inline: 16px;
        }
        .error-box {
          margin-inline: 14px;
        }
        .scene-form .more-settings .form-row {
          grid-template-columns: 1fr 1fr;
        }
        .scene-panel.mobile-open {
          scroll-margin-top: 12px;
        }
        .report-loader {
          padding: 45px 10px;
        }
      }
      @media (max-width: 370px) {
        .header-inner {
          padding-inline: 12px;
        }
        .brand-name {
          font-size: 16px;
        }
        .brand-kicker {
          letter-spacing: 0;
        }
        .brand-mark {
          width: 38px;
          height: 38px;
        }
        .language-select {
          width: 99px;
        }
        .workspace {
          padding-inline: 10px;
        }
        .welcome {
          padding-inline: 16px;
        }
        .welcome h1 {
          font-size: 25px;
        }
        .scenario-icon {
          font-size: 17px;
        }
        .scenario-card {
          gap: 6px;
        }
        .head-actions .btn {
          padding: 7px;
        }
        .chat-head {
          gap: 8px;
          padding-inline: 12px;
        }
        .partner {
          gap: 7px;
        }
        .message-body {
          max-width: 86%;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *:before,
        *:after {
          scroll-behavior: auto !important;
          animation: none !important;
          transition: none !important;
        }
      }
      @media print {
        .site-header,
        .scene-panel,
        .creator-footer,
        .chat-head,
        .chat-tags,
        .tabs,
        .error-box,
        .report-toolbar,
        .export-option,
        .ecosystem-card,
        .toast {
          display: none !important;
        }
        .workspace {
          display: block;
          margin: 0;
          padding: 0;
        }
        .panel {
          border: 0;
          box-shadow: none;
        }
        .report-panel {
          padding: 0;
        }
        .area-card,
        .report-overview,
        .feedback-item,
        .vocab-item,
        .strength-card {
          break-inside: avoid;
          background: #fff;
          color: #111;
          border-color: #ccc;
        }
        body {
          background: #fff;
          color: #111;
        }
        .area-card > summary {
          display: block;
        }
        .area-card:not([open]) > *:not(summary) {
          display: block;
        }
        .report-section {
          break-inside: avoid;

        function reportPlainText(locale = state.reportLocale) {
          const r = state.report;
          if (!r) return "";
          const label = (k) => t(k, {}, locale),
            s = stats(),
            lines = [
              "LingoTalk | گپ‌یار",
              label("reportTitle"),
              `${label("practice")}: ${langInfo(state.config.target).name}`,
              `${s.turns} ${label("messages")} · ${s.words} ${label("words")}`,
              r.estimatedLevel
                ? `${label("estimatedLevel")}: ${r.estimatedLevel}`
                : label("noLevel"),
              "",
              r.overview,
              r.levelNote,
            ];
          if (r.strengths.length) {
            lines.push("", label("strengths"));
            r.strengths.forEach((x) =>
              lines.push(x.title, `“${x.evidence}”`, x.explanation),
            );
          }
          for (const key of AREA_KEYS) {
            const area = r.areas[key];
            lines.push("", label(key), area.assessment);
            area.items.forEach((x) =>
              lines.push(
                `${label("original")}: ${x.original}`,
                `${label("improved")}: ${x.improved}`,
                x.explanation,
              ),
            );
          }
          lines.push("", label("importantVocabulary"));
          r.vocabulary.forEach((x) =>
            lines.push(`${x.term} — ${x.meaning}`, x.example),
          );
          if (r.priorities.length) {
            lines.push("", label("priorities"));
            r.priorities.forEach((x) =>
              lines.push(`${x.title}: ${x.explanation}`),
            );
          }
          lines.push("", label("reportEvidenceNote"));
          return lines.filter((x) => x !== undefined).join("\n");
        }
        async function copyText(text) {
          if (!text) return;
          try {
            if (navigator.clipboard && window.isSecureContext) {
              try {
                await navigator.clipboard.writeText(text);
                showToast(t("copied"));
                return;
              } catch {
                /* Fall back to a user-initiated selection. */
              }
            }
            const active = document.activeElement,
              area = node("textarea");
            area.value = text;
            area.style.cssText = "position:fixed;top:-1000px;left:-1000px";
            document.body.append(area);
            area.focus();
            area.select();
            const ok = document.execCommand("copy");
            area.remove();
            active?.focus({ preventScroll: true });
            if (!ok) throw new Error("Copy unavailable");
            showToast(t("copied"));
          } catch {
            showToast(t("copyFailed"));
          }
        }
        function copyVocabulary() {
          if (!state.report?.vocabulary.length) {
            showToast(t("noVocabulary"));
            return;
          }
          copyText(
            [...new Set(state.report.vocabulary.map((x) => x.term))].join("\n"),
          );
        }
        function buildWordDocument() {
          const r = state.report,
            c = state.config,
            locale = state.reportLocale,
            dir = langInfo(locale).dir,
            targetDir = langInfo(c.target).dir,
            label = (k) => esc(t(k, {}, locale)),
            p = (text) => "<p>" + esc(text).replace(/\n/g, "<br>") + "</p>",
            q = (text) =>
              '<div class="quote" dir="' +
              targetDir +
              '">' +
              esc(text).replace(/\n/g, "<br>") +
              "</div>";
          const date = new Intl.DateTimeFormat(locale, {
            dateStyle: "long",
            timeStyle: "short",
          }).format(new Date(state.endedAt));
          const s = stats();
          let body =
            '<div class="cover"><div class="kicker">LINGOTALK · گپ‌یار</div><h1>' +
            label("reportTitle") +
            "</h1>" +
            p(date) +
            '</div><table class="meta"><tr><th>' +
            label("practice") +
            "</th><td>" +
            esc(langInfo(c.target).label) +
            "</td></tr><tr><th>" +
            label("level") +
            "</th><td>" +
            esc(c.level === "auto" ? t("autoLevel", {}, locale) : c.level) +
            "</td></tr><tr><th>" +
            label("scenario") +
            "</th><td>" +
            esc(c.scenario || t("scenarioFallback", {}, locale)) +
            "</td></tr><tr><th>" +
            label("conversation") +
            "</th><td>" +
            s.turns +
            " " +
            label("messages") +
            " · " +
            s.words +
            " " +
            label("words") +
            "</td></tr></table>" +
            p(r.overview) +
            (r.estimatedLevel
              ? "<p><b>" +
                label("estimatedLevel") +
                ": " +
                r.estimatedLevel +
                "</b></p>"
              : p(t("noLevel", {}, locale))) +
            p(r.levelNote);
          if (r.strengths.length) {
            body += "<h2>" + label("strengths") + "</h2>";
            for (const x of r.strengths)
              body +=
                "<h3>" +
                esc(x.title) +
                "</h3>" +
                q(x.evidence) +
                p(x.explanation);
          }
          for (const key of AREA_KEYS) {
            const a = r.areas[key];
            body += "<h2>" + label(key) + "</h2>" + p(a.assessment);
            for (const x of a.items) {
              body +=
                '<div class="item"><p class="caption">' +
                label(x.kind) +
                " · " +
                label("turn") +
                " " +
                esc(x.turnId.replace(/^u/, "")) +
                "</p><b>" +
                label("original") +
                "</b>" +
                q(x.original) +
                "<b>" +
                label("improved") +
                "</b>" +
                q(x.improved) +
                p(x.explanation) +
                "</div>";
            }
          }
          body += "<h2>" + label("importantVocabulary") + "</h2>";
          for (const x of r.vocabulary)
            body +=
              '<div class="item"><h3 dir="' +
              targetDir +
              '">' +
              esc(x.term) +
              '</h3><span class="caption">' +
              label(x.source) +
              "</span>" +
              p(x.meaning) +
              q(x.example) +
              "</div>";
          if (r.priorities.length) {
            body += "<h2>" + label("priorities") + "</h2>";
            for (const x of r.priorities)
              body += "<h3>" + esc(x.title) + "</h3>" + p(x.explanation);
          }
          body +=
            '<p class="caption">' +
            label("reportEvidenceNote") +
            '</p><p><a href="' +
            DECK_URL +
            '">LingoDeck</a></p>';
          if (state.includeTranscript !== false) {
            body +=
              '<div class="page-break"></div><h2>' +
              label("conversation") +
              "</h2>";
            for (const m of state.transcript.filter((x) => x.status === "sent"))
              body +=
                '<div class="item"><p class="caption">' +
                (m.role === "user"
                  ? label("you")
                  : esc(c.partnerRole || "LingoTalk")) +
                " · " +
                esc(m.id) +
                "</p>" +
                q(m.text) +
                "</div>";
          }
          return (
            '<!DOCTYPE html><html lang="' +
            locale +
            '" dir="' +
            dir +
            '"><head><meta charset="utf-8"><title>LingoTalk Report</title><style>@page{margin:1.8cm}body{font-family:Tahoma,Arial,sans-serif;color:#172033;line-height:1.85;font-size:11pt;direction:' +
            dir +
            "}h1{font-size:24pt}h2{font-size:16pt;margin-top:24px;border-bottom:2px solid #dbe2ec;padding-bottom:7px;color:#24418c}h3{font-size:12pt;margin-bottom:6px}p{margin:8px 0}.cover{padding:20px;background:#f3f5fc;border:1px solid #dce2ed}.kicker{font-size:10pt;color:#3658a0;letter-spacing:1px}.meta{border-collapse:collapse;width:100%;margin:20px 0}.meta td,.meta th{padding:8px;border:1px solid #d6deea;vertical-align:top}.meta th{width:28%;background:#f4f6fa}.item{margin:12px 0 18px;padding:10px;border:1px solid #e0e6ed;page-break-inside:avoid}.quote{background:#f5f7fb;padding:10px;margin:7px 0;unicode-bidi:embed;white-space:normal}.caption{font-size:9pt;color:#697589}.page-break{page-break-before:always}a{color:#2563eb}</style></head><body>" +
            body +
            "</body></html>"
          );
        }
        function downloadWord() {
          if (!state.report) return;
          try {
            const blob = new Blob(["\ufeff" + buildWordDocument()], {
                type: "application/msword;charset=utf-8",
              }),
              url = URL.createObjectURL(blob),
              a = document.createElement("a");
            const stamp = new Date(state.endedAt)
              .toISOString()
              .slice(0, 16)
              .replace("T", "_")
              .replace(":", "-");
            a.href = url;
            a.download = "LingoTalk_Report_" + stamp + ".doc";
            document.body.append(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 2000);
            state.exported = true;
            showToast(t("downloaded"));
          } catch {
            showToast(t("serverError"));
          }
        }

          $("scene-form").addEventListener("submit", (e) => {
            e.preventDefault();
            startSession();
          });
          $("quick-start").addEventListener("click", startSession);
          $("composer").addEventListener("submit", (e) => {
            e.preventDefault();
            sendMessage();
          });
          $("message-input").addEventListener("input", resizeComposer);
          $("message-input").addEventListener("keydown", (e) => {
            if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
              e.preventDefault();
              sendMessage();
            }
          });
          $("finish-btn").addEventListener("click", finishSession);
          $("retry-request").addEventListener("click", executePending);
          $("discard-pending").addEventListener("click", editPending);
          $("continue-after-error").addEventListener("click", returnToChat);
          $("stop-request").addEventListener("click", stopOperation);
          $("stop-report").addEventListener("click", stopOperation);
          $("new-chat").addEventListener("click", requestReset);
          $("reset-cancel").addEventListener("click", () =>
            $("reset-dialog").close(),
          );
          $("reset-confirm").addEventListener("click", resetSession);
          $("mobile-settings").addEventListener("click", toggleMobileSettings);
          $("view-report").addEventListener("click", () =>
            switchView("report"),
          );
          $("conversation-tab").addEventListener("click", () =>
            switchView("conversation"),
          );
          $("report-tab").addEventListener("click", () => switchView("report"));
          $("session-tabs").addEventListener("keydown", (e) => {
            if (["ArrowLeft", "ArrowRight", "Home", "End"].includes(e.key)) {
              e.preventDefault();
              const view =
                e.key === "Home"
                  ? "conversation"
                  : e.key === "End"
                    ? "report"
                    : state.view === "report"
                      ? "conversation"
                      : "report";
              switchView(view);
              $(view === "report" ? "report-tab" : "conversation-tab").focus();
            }
          });
          $("ui-language").addEventListener("change", (e) =>
            applyLanguage(e.target.value),
          );
          $("theme-toggle").addEventListener("click", () => {
            theme = theme === "dark" ? "light" : "dark";
            storage.set("lingotalk-theme", theme);
            renderTheme();
          });
          $("target-language").addEventListener("change", renderHeader);
          $("level").addEventListener("change", renderHeader);
          for (const id of ["scenario", "your-role", "partner-role"])
            $(id).addEventListener("input", () => {
              presetEdited = true;
              renderPresets();
            });
          $("scroll-down").addEventListener("click", scrollToBottom);
          $("messages").addEventListener("scroll", () => {
            const n = $("messages");
            $("scroll-down").hidden =
              n.scrollHeight - n.scrollTop - n.clientHeight < 150;
          });
          window.addEventListener("beforeunload", (e) => {
            if (learnerTurns().length && !state.exported) {
              e.preventDefault();
              e.returnValue = "";
            }
          });
          window.addEventListener("online", () => {
            if (state.error?.code === "NETWORK") showToast(t("retry"));
          });
          applyLanguage(uiLang);
        }
        init();
      })();
    </script>
  </body>
</html>
